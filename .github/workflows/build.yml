name: Build Mazwd APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Project Structure & Download Arabic Fonts
        run: |
          mkdir -p app/src/main/java/com/mazwd/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/font

          FOUND_JAVA=$(find . -maxdepth 2 -iname "MainActivity*.java" | head -n 1)
          if [ -n "$FOUND_JAVA" ]; then
            grep -v '```' "$FOUND_JAVA" | grep -v '^---$' > app/src/main/java/com/mazwd/app/MainActivity.java
          fi

          # تحميل الخطوط العربية مفتوحة المصدر (الأميري + الرقعة + تجوال + ريم كوفي)
          curl -L -s --fail "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf" -o app/src/main/res/font/mazwd_arabic.ttf || rm -f app/src/main/res/font/mazwd_arabic.ttf
          curl -L -s --fail "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf" -o app/src/main/res/font/mazwd_arabic_bold.ttf || rm -f app/src/main/res/font/mazwd_arabic_bold.ttf
          curl -L -s --fail "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Regular.ttf" -o app/src/main/res/font/aref_ruqaa.ttf || rm -f app/src/main/res/font/aref_ruqaa.ttf
          curl -L -s --fail "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf" -o app/src/main/res/font/aref_ruqaa_bold.ttf || rm -f app/src/main/res/font/aref_ruqaa_bold.ttf
          curl -L -s --fail "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf" -o app/src/main/res/font/tajawal_regular.ttf || rm -f app/src/main/res/font/tajawal_regular.ttf
          curl -L -s --fail "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf" -o app/src/main/res/font/tajawal_bold.ttf || rm -f app/src/main/res/font/tajawal_bold.ttf
          curl -L -s --fail "https://raw.githubusercontent.com/google/fonts/main/ofl/reemkufi/ReemKufi%5Bwght%5D.ttf" -o app/src/main/res/font/reem_kufi.ttf || rm -f app/src/main/res/font/reem_kufi.ttf
          cp app/src/main/res/font/reem_kufi.ttf app/src/main/res/font/reem_kufi_bold.ttf 2>/dev/null || true

          printf '%s\n' \
            'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' \
            'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' \
            'rootProject.name = "MazwdNative"' \
            'include ":app"' \
            > settings.gradle

          printf '%s\n' \
            'plugins { id "com.android.application" version "8.5.2" apply false }' \
            > build.gradle

          printf '%s\n' \
            'plugins { id "com.android.application" }' \
            'android {' \
            '    namespace "com.mazwd.app"' \
            '    compileSdk 34' \
            '    defaultConfig {' \
            '        applicationId "com.mazwd.app"' \
            '        minSdk 27' \
            '        targetSdk 34' \
            '        versionCode 3' \
            '        versionName "2.1"' \
            '    }' \
            '    buildTypes {' \
            '        release {' \
            '            minifyEnabled false' \
            '            signingConfig signingConfigs.debug' \
            '        }' \
            '    }' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_1_8' \
            '        targetCompatibility JavaVersion.VERSION_1_8' \
            '    }' \
            '}' \
            > app/build.gradle

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <application' \
            '        android:theme="@style/AppTheme"' \
            '        android:label="مفكرة مزود"' \
            '        android:icon="@drawable/app_icon"' \
            '        android:allowBackup="false"' \
            '        android:supportsRtl="true">' \
            '        <activity' \
            '            android:name=".MainActivity"' \
            '            android:screenOrientation="portrait"' \
            '            android:windowSoftInputMode="adjustResize"' \
            '            android:configChanges="orientation|screenSize|keyboardHidden"' \
            '            android:exported="true">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN"/>' \
            '                <category android:name="android.intent.category.LAUNCHER"/>' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '</manifest>' \
            > app/src/main/AndroidManifest.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">' \
            '        <item name="android:fontFamily">sans-serif</item>' \
            '        <item name="android:colorPrimary">#154C79</item>' \
            '        <item name="android:colorPrimaryDark">#0F385A</item>' \
            '        <item name="android:colorAccent">#154C79</item>' \
            '        <item name="android:navigationBarColor">#F4F6F9</item>' \
            '        <item name="android:statusBarColor">#F4F6F9</item>' \
            '        <item name="android:windowLightStatusBar">true</item>' \
            '        <item name="android:windowLightNavigationBar">true</item>' \
            '        <item name="android:windowActionModeOverlay">true</item>' \
            '    </style>' \
            '</resources>' \
            > app/src/main/res/values/styles.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<vector xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:width="108dp"' \
            '    android:height="108dp"' \
            '    android:viewportWidth="108"' \
            '    android:viewportHeight="108">' \
            '    <path android:fillColor="#154C79" android:pathData="M0,0h108v108h-108z"/>' \
            '    <path android:fillColor="#FFFFFF" android:pathData="M32,26h44c3.3,0 6,2.7 6,6v44c0,3.3 -2.7,6 -6,6H32c-3.3,0 -6,-2.7 -6,-6V32C26,28.7 28.7,26 32,26z"/>' \
            '    <path android:fillColor="#154C79" android:pathData="M36,40h36v4H36zM36,52h36v4H36zM36,64h22v4H36z"/>' \
            '</vector>' \
            > app/src/main/res/drawable/app_icon.xml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mazwd-Notepad-APK
          path: app/build/outputs/apk/release/*.apk
