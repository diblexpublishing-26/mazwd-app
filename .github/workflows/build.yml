name: Build Mazwd Notepad APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Fixed Signing Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/mazwd_fixed.keystore
          key: mazwd-fixed-signing-keystore-permanent-v1

      - name: Generate Fixed Keystore if Missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/mazwd_fixed.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/mazwd_fixed.keystore \
              -alias mazwd_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mazwd123456 \
              -keypass mazwd123456 \
              -dname "CN=Shafiqa Mazwd, OU=Heritage, O=Mazwd, L=Hadhramaut, S=Yemen, C=YE"
          fi

      - name: Prepare Project Structure & Apply Surgical Refinements
        run: |
          mkdir -p app/src/main/java/com/mazwd/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/font
          mkdir -p app/src/main/res/values

          if [ -f "MainActivity.java" ]; then
            cp MainActivity.java app/src/main/java/com/mazwd/app/MainActivity.java
          else
            FOUND_FILE=$(find . -name "MainActivity.java" | head -n 1)
            if [ -n "$FOUND_FILE" ] && [ "$FOUND_FILE" != "./app/src/main/java/com/mazwd/app/MainActivity.java" ]; then
              cp "$FOUND_FILE" app/src/main/java/com/mazwd/app/MainActivity.java
            fi
          fi
          sed -i '/^\x60/d' app/src/main/java/com/mazwd/app/MainActivity.java

          python3 - << 'EOF'
          import re

          path = "app/src/main/java/com/mazwd/app/MainActivity.java"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          # 1. Replace Turquoise Theme with Luxury Diamond Black ("الأسود الماسي")
          code = code.replace(
              '{"التركواز الهادئ", "#115E59", "#042F2E", "#CCFBF1"}',
              '{"الأسود الماسي", "#18181B", "#09090B", "#F4F4F5"}'
          )

          # 2. Move sliding switches in Settings to the RIGHT of the text (index 0 in RTL row)
          old_switch_add = "row.addView(switchTrack, new LinearLayout.LayoutParams(dp(48), dp(26)));"
          new_switch_add = """LinearLayout.LayoutParams swLp = new LinearLayout.LayoutParams(dp(48), dp(26));
                  swLp.leftMargin = dp(12);
                  row.addView(switchTrack, 0, swLp);"""
          if old_switch_add in code:
              code = code.replace(old_switch_add, new_switch_add, 1)

          # 3. Rename "تخصيص وترتيب أدوات التحرير" -> "تخصيص أدوات التحرير"
          code = code.replace("تخصيص وترتيب أدوات التحرير", "تخصيص أدوات التحرير")

          # 4. Remove [ نصوص | رموز ] toggle from inside Toolbar Customization Dialog
          code = code.replace("root.addView(createToolbarModeSegmentedRow(null));", "// segmented toggle kept in Settings only", 1)

          # 5. Fix "ي" dots in Font Dropdown for non-Scheherazade fonts (idx != 3)
          old_font_item = "item.setIncludeFontPadding(false);"
          new_font_item = "item.setIncludeFontPadding(idx != 3);"
          if old_font_item in code:
              code = code.replace(old_font_item, new_font_item, 1)

          # 6. Create .nomedia inside Safe Vault so snapshots don't clutter Recent Files
          old_snap_call = "Uri vaultDirUri = getOrCreateSafeVaultDirectoryUri(true);"
          new_snap_call = """Uri vaultDirUri = getOrCreateSafeVaultDirectoryUri(true);
                      ensureNoMediaInSafeVault(vaultDirUri);"""
          if old_snap_call in code and "ensureNoMediaInSafeVault" not in code:
              code = code.replace(old_snap_call, new_snap_call, 1)

          # 7. Enhance showStyledDialog:
          #    - Fix 1mm bottom clipping on all dialog buttons
          #    - Fix "ي" dots on pure text labels (excluding Scheherazade idx==3, buttons, badges, and reader)
          #    - Move "استعادة الافتراضي" to top of Toolbar Customization dialog + add confirmation dialog
          old_styled_dialog = """    private void showStyledDialog(Dialog dialog, View rootView, float widthFraction, int heightSpec) {
                  dialog.setContentView(rootView);"""
          old_styled_dialog_alt = """    private void showStyledDialog(Dialog dialog, View rootView, float widthFraction, int heightSpec) {\n        dialog.setContentView(rootView);"""

          new_styled_dialog = """    private void showStyledDialog(Dialog dialog, View rootView, float widthFraction, int heightSpec) {
          prepareDialogViewHierarchy(dialog, rootView);
          dialog.setContentView(rootView);"""

          if old_styled_dialog_alt in code and "prepareDialogViewHierarchy" not in code:
              code = code.replace(old_styled_dialog_alt, new_styled_dialog, 1)

          # Also apply "ي" dot fix on Home screen pure text labels after showHomeScreen builds UI
          old_home_end = "if (restoreY > 0 && homeScrollView != null) {"
          new_home_end = """applyUnclippedArabicTextLabels(rootContainer);
                  if (restoreY > 0 && homeScrollView != null) {"""
          if old_home_end in code and "applyUnclippedArabicTextLabels(rootContainer)" not in code:
              code = code.replace(old_home_end, new_home_end, 1)

          helper_methods = """
      private void ensureNoMediaInSafeVault(Uri vaultDirUri) {
          if (folderUri == null || vaultDirUri == null) return;
          try {
              String vaultDocId = DocumentsContract.getDocumentId(vaultDirUri);
              Uri childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(folderUri, vaultDocId);
              String[] proj = new String[]{DocumentsContract.Document.COLUMN_DISPLAY_NAME};
              boolean exists = false;
              try (Cursor c = getContentResolver().query(childrenUri, proj, null, null, null)) {
                  if (c != null) {
                      while (c.moveToNext()) {
                          if (".nomedia".equals(c.getString(0))) {
                              exists = true;
                              break;
                          }
                      }
                  }
              }
              if (!exists) {
                  DocumentsContract.createDocument(getContentResolver(), vaultDirUri, "application/octet-stream", ".nomedia");
              }
          } catch (Exception ignored) {
          }
      }

      @Override
      public void onWindowFocusChanged(boolean hasFocus) {
          super.onWindowFocusChanged(hasFocus);
          if (!hasFocus && currentScreen == ScreenState.EDIT) {
              saveCurrentFileImmediately(false);
          }
      }

      @Override
      protected void onStop() {
          if (currentScreen == ScreenState.EDIT) {
              saveCurrentFileImmediately(false);
          }
          super.onStop();
      }

      private void applyUnclippedArabicTextLabels(View view) {
          if (view == null) return;
          boolean allowFontPad = (getSelectedFontIndex() != 3);
          if (view.getClass() == TextView.class && view != readTextView && view.getBackground() == null) {
              ((TextView) view).setIncludeFontPadding(allowFontPad);
          }
          if (view instanceof ViewGroup) {
              ViewGroup vg = (ViewGroup) view;
              for (int i = 0; i < vg.getChildCount(); i++) {
                  applyUnclippedArabicTextLabels(vg.getChildAt(i));
              }
          }
      }

      private void prepareDialogViewHierarchy(Dialog dialog, View rootView) {
          if (rootView == null) return;
          applyUnclippedArabicTextLabels(rootView);
          rootView.setPadding(
                  rootView.getPaddingLeft(),
                  rootView.getPaddingTop(),
                  rootView.getPaddingRight(),
                  rootView.getPaddingBottom() + dp(4)
          );
          fixDialogButtonsAndResetLayout(rootView, rootView);
      }

      private void fixDialogButtonsAndResetLayout(View current, View rootView) {
          if (current instanceof Button) {
              Button btn = (Button) current;
              ViewGroup.LayoutParams lp = btn.getLayoutParams();
              if (lp instanceof ViewGroup.MarginLayoutParams) {
                  ViewGroup.MarginLayoutParams mlp = (ViewGroup.MarginLayoutParams) lp;
                  mlp.topMargin = Math.max(mlp.topMargin, dp(1));
                  mlp.bottomMargin = Math.max(mlp.bottomMargin, dp(3));
                  btn.setLayoutParams(mlp);
              }
              CharSequence txt = btn.getText();
              if (txt != null && txt.toString().contains("الافتراضي") && rootView instanceof LinearLayout) {
                  LinearLayout rootLinear = (LinearLayout) rootView;
                  if (btn.getParent() instanceof ViewGroup) {
                      ViewGroup parentGroup = (ViewGroup) btn.getParent();
                      if (parentGroup != rootLinear || rootLinear.indexOfChild(btn) > 3) {
                          parentGroup.removeView(btn);
                          LinearLayout.LayoutParams topBtnLp = new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, dp(42));
                          topBtnLp.topMargin = dp(8);
                          topBtnLp.bottomMargin = dp(8);
                          int insertIdx = Math.min(2, rootLinear.getChildCount());
                          rootLinear.addView(btn, insertIdx, topBtnLp);
                          btn.setOnClickListener( e -> showResetToolbarConfirmDialog(btn) );
                      }
                  }
              }
          } else if (current instanceof ViewGroup) {
              ViewGroup vg = (ViewGroup) current;
              vg.setClipChildren(false);
              vg.setClipToPadding(false);
              List<View> children = new ArrayList<>();
              for (int i = 0; i < vg.getChildCount(); i++) {
                  children.add(vg.getChildAt(i));
              }
              for (View child : children) {
                  fixDialogButtonsAndResetLayout(child, rootView);
              }
          }
      }

      private void showResetToolbarConfirmDialog(Button resetBtn) {
          Dialog confirmDialog = new Dialog(this);
          confirmDialog.requestWindowFeature(Window.FEATURE_NO_TITLE);
          LinearLayout box = new LinearLayout(this);
          box.setOrientation(LinearLayout.VERTICAL);
          box.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
          box.setBackground(roundedRect(getCardBgColor(), 18, 1, getBorderColor()));
          box.setPadding(dp(20), dp(18), dp(20), dp(16));

          TextView title = new TextView(this);
          title.setText("استعادة الإعدادات الافتراضية");
          title.setTextColor(getAccentTextColor());
          title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 17);
          title.setTypeface(getAppTypeface(true));
          title.setGravity(Gravity.RIGHT);
          box.addView(title);

          TextView msg = new TextView(this);
          msg.setText("هل أنت متأكد أنك تريد استعادة الإعدادات الافتراضية؟");
          msg.setTextColor(getTextPrimaryColor());
          msg.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14.5f);
          msg.setTypeface(getAppTypeface(false));
          msg.setGravity(Gravity.RIGHT);
          LinearLayout.LayoutParams mLp = new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
          mLp.topMargin = dp(10);
          mLp.bottomMargin = dp(18);
          box.addView(msg, mLp);

          LinearLayout btnRow = new LinearLayout(this);
          btnRow.setOrientation(LinearLayout.HORIZONTAL);

          Button yesBtn = new Button(this);
          configureTextButton(yesBtn, "نعم", 14, true, Color.WHITE, 44);
          yesBtn.setBackground(roundedRect(getPrimaryColor(), 10, 0, 0));
          yesBtn.setOnClickListener(v -> {
              confirmDialog.dismiss();
              Object tagListener = resetBtn.getTag();
              if (tagListener instanceof View.OnClickListener) {
                  ((View.OnClickListener) tagListener).onClick(resetBtn);
              }
          });
          LinearLayout.LayoutParams b1Lp = new LinearLayout.LayoutParams(0, dp(44), 1f);
          b1Lp.leftMargin = dp(6);
          btnRow.addView(yesBtn, b1Lp);

          Button noBtn = new Button(this);
          configureTextButton(noBtn, "لا", 14, true, getTextPrimaryColor(), 44);
          noBtn.setBackground(roundedRect(getSecondaryBtnBgColor(), 10, 1, getBorderColor()));
          noBtn.setOnClickListener(v -> confirmDialog.dismiss());
          LinearLayout.LayoutParams b2Lp = new LinearLayout.LayoutParams(0, dp(44), 1f);
          b2Lp.rightMargin = dp(6);
          btnRow.addView(noBtn, b2Lp);

          box.addView(btnRow);
          showStyledDialog(confirmDialog, box, 0.86f, ViewGroup.LayoutParams.WRAP_CONTENT);
      }
  """

          # Preserve original reset button click action inside its tag so "نعم" executes it
          old_reset_pattern = re.compile(
              r'(\w+)\.setOnClickListener\(v\s*->\s*\{\s*currentOrder\.clear\(\);',
              re.DOTALL
          )
          match = old_reset_pattern.search(code)
          if match:
              btn_var = match.group(1)
              code = old_reset_pattern.sub(
                  f'View.OnClickListener origResetAction = v -> {{\n            currentOrder.clear();',
                  code,
                  count=1
              )
              # Attach origResetAction to both tag and listener
              target_add = f'rebuildListRef[0].run();\n        }};'
              if target_add in code:
                  code = code.replace(
                      target_add,
                      target_add + f'\n        {btn_var}.setTag(origResetAction);\n        {btn_var}.setOnClickListener(origResetAction);',
                      1
                  )

          if "prepareDialogViewHierarchy" not in code:
              last_brace = code.rfind("}")
              if last_brace != -1:
                  code = code[:last_brace] + helper_methods + "\n}\n"

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          EOF

      - name: Download All 12 Open-Source Arabic Fonts
        run: |
          cd app/src/main/res/font
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Regular.ttf" -o mazwd_arabic.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Bold.ttf" -o mazwd_arabic_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Regular.ttf" -o aref_ruqaa.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf" -o aref_ruqaa_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf" -o tajawal_regular.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf" -o tajawal_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/reemkufi/ReemKufi%5Bwght%5D.ttf" -o reem_kufi.ttf
          cp reem_kufi.ttf reem_kufi_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/scheherazadenew/ScheherazadeNew-Bold.ttf" -o scheherazade_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf" -o readex_pro.ttf
          cp readex_pro.ttf readex_pro_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf" -o noto_sans_arabic.ttf
          cp noto_sans_arabic.ttf noto_sans_arabic_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf" -o noto_naskh_arabic.ttf
          cp noto_naskh_arabic.ttf noto_naskh_arabic_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf" -o ibm_plex_arabic.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf" -o ibm_plex_arabic_bold.ttf

      - name: Generate Luxury Royal Navy App Icon & All Vector Icons
        run: |
          cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
