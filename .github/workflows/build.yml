name: Build Mazwd Notepad APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Fixed Signing Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/mazwd_fixed.keystore
          key: mazwd-fixed-signing-keystore-permanent-v1

      - name: Generate Fixed Keystore If Not Cached
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/mazwd_fixed.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/mazwd_fixed.keystore \
              -alias mazwd_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mazwd123456 \
              -keypass mazwd123456 \
              -dname "CN=Shafiqa Mazwd, OU=Heritage, O=Mazwd, L=Hadhramaut, S=Yemen, C=YE"
          fi

      - name: Create Android Project Structure & Configs
        run: |
          mkdir -p app/src/main/java/com/mazwd/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/font

          if [ -f "MainActivity.java" ]; then
            cp MainActivity.java app/src/main/java/com/mazwd/app/MainActivity.java
          else
            FOUND_FILE=$(find . -name "MainActivity.java" | head -n 1)
            if [ -n "$FOUND_FILE" ] && [ "$FOUND_FILE" != "./app/src/main/java/com/mazwd/app/MainActivity.java" ]; then
              cp "$FOUND_FILE" app/src/main/java/com/mazwd/app/MainActivity.java
            fi
          fi

          if [ ! -f "app/src/main/java/com/mazwd/app/MainActivity.java" ]; then
            echo "ERROR: MainActivity.java not found!"
            exit 1
          fi

          sed -i '/^\x60/d' app/src/main/java/com/mazwd/app/MainActivity.java

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MazwdNotepad"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mazwd.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mazwd.app"
                  minSdk 27
                  targetSdk 34
                  versionCode 12
                  versionName "2.7.1"
              }

              signingConfigs {
                  fixedConfig {
                      storeFile file(System.getProperty("user.home") + "/.android/mazwd_fixed.keystore")
                      storePassword "mazwd123456"
                      keyAlias "mazwd_key"
                      keyPassword "mazwd123456"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixedConfig
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.fixedConfig
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }

          dependencies {
          }
          EOF

      - name: Apply v2.7.1 Refinements to MainActivity.java
        run: |
          cat << 'PYEOF' > patch_app.py
          import re

          path = "app/src/main/java/com/mazwd/app/MainActivity.java"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          # 1. Replace Turquoise Theme with Diamond Black
          code = code.replace(
              '{"التركواز الهادئ", "#115E59", "#042F2E", "#CCFBF1"}',
              '{"الأسود الماسي", "#18181B", "#09090B", "#F4F4F5"}'
          )

          # 2. Rename Toolbar Customization Title & Button
          code = code.replace("تخصيص وترتيب أدوات التحرير", "تخصيص أدوات التحرير")

          # 3. Move Settings Switches to the Right of Option Text
          old_sw = "row.addView(textCol);\n        row.addView(switchTrack, swLp);"
          new_sw = "swLp.leftMargin = dp(12);\n        row.addView(switchTrack, 0, swLp);\n        row.addView(textCol);"
          if old_sw in code:
              code = code.replace(old_sw, new_sw)
          else:
              code = re.sub(
                  r'row\.addView\(textCol\);\s*row\.addView\(switchTrack,\s*swLp\);',
                  'swLp.leftMargin = dp(12);\n        row.addView(switchTrack, 0, swLp);\n        row.addView(textCol);',
                  code
              )

          # 4. Hide Display Mode Segmented Row inside Toolbar Customization Dialog
          code = code.replace(
              "root.addView(modeCard);",
              "modeCard.setVisibility(View.GONE);\n        root.addView(modeCard);"
          )
          code = code.replace(
              "        root.addView(modeRow);\n",
              "        modeRow.setVisibility(View.GONE);\n"
          )

          # 5. Add Confirmation Dialog when Resetting Toolbar to Default
          if "showResetToolbarConfirmDialog(v)" not in code:
              code = code.replace(
                  "currentOrder.clear();",
                  "if (!isResetToolbarConfirmed) { showResetToolbarConfirmDialog(v); return; } isResetToolbarConfirmed = false; currentOrder.clear();",
                  1
              )

          # 6. Fix Font Dropdown Item Padding for Arabic "ي" Dots
          code = code.replace(
              "item.setTypeface(getAppTypeface(i, true));",
              "item.setTypeface(getAppTypeface(i, true));\n            item.setIncludeFontPadding(i != 3);"
          )
          code = code.replace(
              "tv.setText(FONT_NAMES[i]);",
              "tv.setText(FONT_NAMES[i]);\n            tv.setIncludeFontPadding(idx != 3);"
          )

          # 7. Hook Dialog Button Unclipping & Reset Button Top Placement into showStyledDialog
          if "prepareDialogViewHierarchy(" not in code:
              code = re.sub(
                  r'(void\s+showStyledDialog\s*\(\s*Dialog\s+\w+\s*,\s*View\s+(\w+)\s*,\s*float\s+\w+\s*,\s*int\s+\w+\s*\)\s*\{)',
                  r'\1\n        prepareDialogViewHierarchy(\2);',
                  code,
                  count=1
              )

          # 8. Unclip Pure Arabic Text Labels on Screen Refresh
          if "applyUnclippedArabicTextLabels(rootContainer);" not in code:
              if "applyFontRecursively(rootContainer);" in code:
                  code = code.replace(
                      "applyFontRecursively(rootContainer);",
                      "applyFontRecursively(rootContainer);\n        applyUnclippedArabicTextLabels(rootContainer);"
                  )
              elif "applyThemeColors(rootContainer);" in code:
                  code = code.replace(
                      "applyThemeColors(rootContainer);",
                      "applyThemeColors(rootContainer);\n        applyUnclippedArabicTextLabels(rootContainer);"
                  )

          # 9. Create .nomedia Inside Safe Vault Directory
          if "ensureNoMediaInSafeVault(vaultDirUri);" not in code:
              code = code.replace(
                  "if (vaultDirUri == null) return false;",
                  "if (vaultDirUri == null) return false;\n            ensureNoMediaInSafeVault(vaultDirUri);"
              )

          # 10. Append Self-Contained Helper Methods Before Final Closing Brace
          blocks_to_append = []

          if "boolean isResetToolbarConfirmed" not in code:
              blocks_to_append.extend([
                  "    private boolean isResetToolbarConfirmed = false;",
                  ""
              ])

          if "void showResetToolbarConfirmDialog(" not in code:
              blocks_to_append.extend([
                  "    private void showResetToolbarConfirmDialog(final View resetBtn) {",
                  "        final Dialog confirmDialog = new Dialog(this);",
                  "        LinearLayout root = new LinearLayout(this);",
                  "        root.setOrientation(LinearLayout.VERTICAL);",
                  "        root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);",
                  "        root.setPadding(dp(20), dp(20), dp(20), dp(20));",
                  "        GradientDrawable bg = new GradientDrawable();",
                  "        bg.setColor(Color.WHITE);",
                  "        bg.setCornerRadius(dp(18));",
                  "        root.setBackground(bg);",
                  "        TextView titleTv = new TextView(this);",
                  "        titleTv.setText(\"استعادة الإعدادات الافتراضية\");",
                  "        titleTv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 17);",
                  "        titleTv.setTextColor(Color.parseColor(\"#0F172A\"));",
                  "        titleTv.setGravity(Gravity.CENTER);",
                  "        LinearLayout.LayoutParams tLp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);",
                  "        tLp.bottomMargin = dp(10);",
                  "        root.addView(titleTv, tLp);",
                  "        TextView msgTv = new TextView(this);",
                  "        msgTv.setText(\"هل أنت متأكد أنك تريد استعادة الإعدادات الافتراضية؟\");",
                  "        msgTv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);",
                  "        msgTv.setTextColor(Color.parseColor(\"#475569\"));",
                  "        msgTv.setGravity(Gravity.CENTER);",
                  "        LinearLayout.LayoutParams mLp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);",
                  "        mLp.bottomMargin = dp(18);",
                  "        root.addView(msgTv, mLp);",
                  "        LinearLayout actions = new LinearLayout(this);",
                  "        actions.setOrientation(LinearLayout.HORIZONTAL);",
                  "        actions.setGravity(Gravity.CENTER);",
                  "        Button yesBtn = new Button(this);",
                  "        yesBtn.setText(\"نعم\");",
                  "        yesBtn.setAllCaps(false);",
                  "        yesBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);",
                  "        yesBtn.setTextColor(Color.WHITE);",
                  "        GradientDrawable yesBg = new GradientDrawable();",
                  "        yesBg.setColor(getPrimaryColor());",
                  "        yesBg.setCornerRadius(dp(10));",
                  "        yesBtn.setBackground(yesBg);",
                  "        LinearLayout.LayoutParams lp1 = new LinearLayout.LayoutParams(0, dp(42), 1f);",
                  "        lp1.leftMargin = dp(8);",
                  "        lp1.topMargin = dp(2);",
                  "        lp1.bottomMargin = dp(3);",
                  "        yesBtn.setLayoutParams(lp1);",
                  "        Button noBtn = new Button(this);",
                  "        noBtn.setText(\"لا\");",
                  "        noBtn.setAllCaps(false);",
                  "        noBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);",
                  "        noBtn.setTextColor(Color.parseColor(\"#1E293B\"));",
                  "        GradientDrawable noBg = new GradientDrawable();",
                  "        noBg.setColor(Color.parseColor(\"#E2E8F0\"));",
                  "        noBg.setCornerRadius(dp(10));",
                  "        noBtn.setBackground(noBg);",
                  "        LinearLayout.LayoutParams lp2 = new LinearLayout.LayoutParams(0, dp(42), 1f);",
                  "        lp2.topMargin = dp(2);",
                  "        lp2.bottomMargin = dp(3);",
                  "        noBtn.setLayoutParams(lp2);",
                  "        actions.addView(yesBtn);",
                  "        actions.addView(noBtn);",
                  "        root.addView(actions);",
                  "        yesBtn.setOnClickListener(v -> {",
                  "            confirmDialog.dismiss();",
                  "            isResetToolbarConfirmed = true;",
                  "            if (resetBtn != null) resetBtn.performClick();",
                  "        });",
                  "        noBtn.setOnClickListener(v -> confirmDialog.dismiss());",
                  "        applyThemeColors(root);",
                  "        showStyledDialog(confirmDialog, root, 0.88f, 380);",
                  "    }",
                  ""
              ])

          if "void prepareDialogViewHierarchy(" not in code:
              blocks_to_append.extend([
                  "    private void prepareDialogViewHierarchy(View rootView) {",
                  "        if (rootView == null) return;",
                  "        rootView.setPadding(",
                  "            rootView.getPaddingLeft(),",
                  "            rootView.getPaddingTop(),",
                  "            rootView.getPaddingRight(),",
                  "            rootView.getPaddingBottom() + dp(4)",
                  "        );",
                  "        fixDialogButtonsAndResetLayout(rootView);",
                  "        applyUnclippedArabicTextLabels(rootView);",
                  "    }",
                  "",
                  "    private void fixDialogButtonsAndResetLayout(View view) {",
                  "        if (view == null) return;",
                  "        if (view instanceof ViewGroup) {",
                  "            ViewGroup vg = (ViewGroup) view;",
                  "            vg.setClipChildren(false);",
                  "            vg.setClipToPadding(false);",
                  "            Button foundResetBtn = null;",
                  "            ViewGroup actionsRow = null;",
                  "            for (int i = 0; i < vg.getChildCount(); i++) {",
                  "                View child = vg.getChildAt(i);",
                  "                if (child instanceof Button) {",
                  "                    Button b = (Button) child;",
                  "                    if (b.getLayoutParams() instanceof ViewGroup.MarginLayoutParams) {",
                  "                        ViewGroup.MarginLayoutParams mlp = (ViewGroup.MarginLayoutParams) b.getLayoutParams();",
                  "                        if (mlp.bottomMargin < dp(3)) mlp.bottomMargin = dp(3);",
                  "                        if (mlp.topMargin < dp(1)) mlp.topMargin = dp(1);",
                  "                        b.setLayoutParams(mlp);",
                  "                    }",
                  "                    if (\"استعادة الافتراضي\".equals(String.valueOf(b.getText()).trim())) {",
                  "                        foundResetBtn = b;",
                  "                        actionsRow = vg;",
                  "                    }",
                  "                } else {",
                  "                    fixDialogButtonsAndResetLayout(child);",
                  "                }",
                  "            }",
                  "            if (foundResetBtn != null && actionsRow != null && actionsRow.getParent() instanceof LinearLayout) {",
                  "                LinearLayout dialogRoot = (LinearLayout) actionsRow.getParent();",
                  "                actionsRow.removeView(foundResetBtn);",
                  "                for (int j = 0; j < actionsRow.getChildCount(); j++) {",
                  "                    View rem = actionsRow.getChildAt(j);",
                  "                    if (rem instanceof Button && \"حفظ\".equals(String.valueOf(((Button) rem).getText()).trim())) {",
                  "                        if (rem.getLayoutParams() instanceof LinearLayout.LayoutParams) {",
                  "                            LinearLayout.LayoutParams slp = (LinearLayout.LayoutParams) rem.getLayoutParams();",
                  "                            slp.rightMargin = 0;",
                  "                            rem.setLayoutParams(slp);",
                  "                        }",
                  "                    }",
                  "                }",
                  "                LinearLayout.LayoutParams topLp = new LinearLayout.LayoutParams(",
                  "                    ViewGroup.LayoutParams.MATCH_PARENT, dp(40)",
                  "                );",
                  "                topLp.bottomMargin = dp(10);",
                  "                topLp.topMargin = dp(2);",
                  "                foundResetBtn.setLayoutParams(topLp);",
                  "                int insertIdx = Math.min(2, dialogRoot.getChildCount());",
                  "                dialogRoot.addView(foundResetBtn, insertIdx);",
                  "            }",
                  "        }",
                  "    }",
                  ""
              ])

          if "void applyUnclippedArabicTextLabels(" not in code:
              blocks_to_append.extend([
                  "    private void applyUnclippedArabicTextLabels(View view) {",
                  "        if (view == null) return;",
                  "        if (view.getClass() == TextView.class && view != readTextView && view.getBackground() == null) {",
                  "            ((TextView) view).setIncludeFontPadding(getSelectedFontIndex() != 3);",
                  "        }",
                  "        if (view instanceof ViewGroup) {",
                  "            ViewGroup vg = (ViewGroup) view;",
                  "            for (int i = 0; i < vg.getChildCount(); i++) {",
                  "                applyUnclippedArabicTextLabels(vg.getChildAt(i));",
                  "            }",
                  "        }",
                  "    }",
                  ""
              ])

          if "void ensureNoMediaInSafeVault(" not in code:
              blocks_to_append.extend([
                  "    private void ensureNoMediaInSafeVault(Uri vaultDirUri) {",
                  "        if (vaultDirUri == null) return;",
                  "        try {",
                  "            String vaultDocId = DocumentsContract.getDocumentId(vaultDirUri);",
                  "            Uri childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(vaultDirUri, vaultDocId);",
                  "            try (Cursor c = getContentResolver().query(",
                  "                    childrenUri,",
                  "                    new String[]{DocumentsContract.Document.COLUMN_DISPLAY_NAME},",
                  "                    null, null, null)) {",
                  "                if (c != null) {",
                  "                    while (c.moveToNext()) {",
                  "                        if (\".nomedia\".equals(c.getString(0))) return;",
                  "                    }",
                  "                }",
                  "            }",
                  "            DocumentsContract.createDocument(getContentResolver(), vaultDirUri, \"application/octet-stream\", \".nomedia\");",
                  "        } catch (Exception ignored) {}",
                  "    }",
                  ""
              ])

          if "void onWindowFocusChanged(" not in code:
              blocks_to_append.extend([
                  "    @Override",
                  "    public void onWindowFocusChanged(boolean hasFocus) {",
                  "        super.onWindowFocusChanged(hasFocus);",
                  "        if (!hasFocus && currentScreen == ScreenState.EDIT) {",
                  "            saveHandler.removeCallbacks(autoSaveRunnable);",
                  "            saveCurrentFileImmediately(false);",
                  "        }",
                  "    }",
                  ""
              ])

          if "void onStop(" not in code:
              blocks_to_append.extend([
                  "    @Override",
                  "    protected void onStop() {",
                  "        if (currentScreen == ScreenState.EDIT) {",
                  "            saveHandler.removeCallbacks(autoSaveRunnable);",
                  "            saveCurrentFileImmediately(false);",
                  "        }",
                  "        super.onStop();",
                  "    }",
                  ""
              ])

          if blocks_to_append:
              last_brace = code.rfind("}")
              if last_brace != -1:
                  code = code[:last_brace] + "\n" + "\n".join(blocks_to_append) + "\n}\n"

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("Successfully patched MainActivity.java for v2.7.1")
          PYEOF
          python3 patch_app.py
          rm patch_app.py

      - name: Download Arabic Fonts
        run: |
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Regular.ttf" -o app/src/main/res/font/mazwd_arabic.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Bold.ttf" -o app/src/main/res/font/mazwd_arabic_bold.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Regular.ttf" -o app/src/main/res/font/aref_ruqaa.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf" -o app/src/main/res/font/aref_ruqaa_bold.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf" -o app/src/main/res/font/tajawal_regular.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf" -o app/src/main/res/font/tajawal_bold.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/reemkufi/ReemKufi%5Bwght%5D.ttf" -o app/src/main/res/font/reem_kufi.ttf
          cp app/src/main/res/font/reem_kufi.ttf app/src/main/res/font/reem_kufi_bold.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/scheherazadenew/ScheherazadeNew-Bold.ttf" -o app/src/main/res/font/scheherazade_bold.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf" -o app/src/main/res/font/readex_pro.ttf
          cp app/src/main/res/font/readex_pro.ttf app/src/main/res/font/readex_pro_bold.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf" -o app/src/main/res/font/noto_sans_arabic.ttf
          cp app/src/main/res/font/noto_sans_arabic.ttf app/src/main/res/font/noto_sans_arabic_bold.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf" -o app/src/main/res/font/noto_naskh_arabic.ttf
          cp app/src/main/res/font/noto_naskh_arabic.ttf app/src/main/res/font/noto_naskh_arabic_bold.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf" -o app/src/main/res/font/ibm_plex_arabic.ttf
          curl -f -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf" -o app/src/main/res/font/ibm_plex_arabic_bold.ttf

      - name: Create Vector Drawables, App Icon & Manifest
        run: |
          cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#1E3A8A"
                  android:pathData="M12,12 L96,12 A14,14 0 0,1 102,26 L102,96 A14,14 0 0,1 88,102 L20,102 A14,14 0 0,1 6,88 L6,26 A14,14 0 0,1 12,12 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,18 L76,18 A6,6 0 0,1 82,24 L82,84 A6,6 0 0,1 76,90 L24,90 A6,6 0 0,1 18,84 L18,24 A6,6 0 0,1 24,18 Z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M73,18 L79,18 A3,3 0 0,1 82,21 L82,87 A3,3 0 0,1 79,90 L73,90 Z"/>
              <path
                  android:fillColor="#1E3A8A"
                  android:pathData="M28,33 L66,33 L66,37 L28,37 Z"/>
              <path
                  android:fillColor="#475569"
                  android:pathData="M28,45 L66,45 L66,48.5 L28,48.5 Z"/>
              <path
                  android:fillColor="#475569"
                  android:pathData="M28,56 L66,56 L66,59.5 L28,59.5 Z"/>
              <path
                  android:fillColor="#475569"
                  android:pathData="M40,67 L66,67 L66,70.5 L40,70.5 Z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M22,78 L36,64 L44,72 L30,86 L20,88 Z"/>
              <path
                  android:fillColor="#FBBF24"
                  android:pathData="M36,64 L56,44 L64,52 L44,72 Z"/>
              <path
                  android:fillColor="#FDE68A"
                  android:pathData="M20,88 L25,85 L23,83 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_undo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12.5,8c-2.65,0 -5.05,0.99 -6.9,2.6L2,7v9h9l-3.62,-3.62c1.39,-1.16 3.16,-1.88 5.12,-1.88 3.54,0 6.55,2.31 7.6,5.5l2.37,-0.78C21.08,11.03 17.15,8 12.5,8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_redo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
