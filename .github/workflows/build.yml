name: Build Mazwd Notepad APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Cache Fixed Signing Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/mazwd_fixed.keystore
          key: mazwd-fixed-signing-keystore-permanent-v1

      - name: Ensure Fixed Signing Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/mazwd_fixed.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/mazwd_fixed.keystore \
              -alias mazwd_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mazwd123456 \
              -keypass mazwd123456 \
              -dname "CN=Shafiqa Mazwd, OU=Heritage, O=Mazwd, L=Hadhramaut, S=Yemen, C=YE"
          fi

      - name: Generate Android Project Structure & Resources
        run: |
          mkdir -p app/src/main/java/com/mazwd/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/font

          if [ -f "MainActivity.java" ]; then
            cp MainActivity.java app/src/main/java/com/mazwd/app/MainActivity.java
          else
            FOUND_FILE=$(find . -name "MainActivity.java" | head -n 1)
            if [ -n "$FOUND_FILE" ] && [ "$FOUND_FILE" != "./app/src/main/java/com/mazwd/app/MainActivity.java" ]; then
              cp "$FOUND_FILE" app/src/main/java/com/mazwd/app/MainActivity.java
            fi
          fi

          sed -i '/^\x60/d' app/src/main/java/com/mazwd/app/MainActivity.java

          cat << 'EOF' > settings.gradle
          rootProject.name = "MazwdNotepad"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Regular.ttf" -o app/src/main/res/font/mazwd_arabic.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Bold.ttf" -o app/src/main/res/font/mazwd_arabic_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Regular.ttf" -o app/src/main/res/font/aref_ruqaa.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf" -o app/src/main/res/font/aref_ruqaa_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf" -o app/src/main/res/font/tajawal_regular.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf" -o app/src/main/res/font/tajawal_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/reemkufi/ReemKufi%5Bwght%5D.ttf" -o app/src/main/res/font/reem_kufi.ttf
          cp app/src/main/res/font/reem_kufi.ttf app/src/main/res/font/reem_kufi_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/scheherazadenew/ScheherazadeNew-Bold.ttf" -o app/src/main/res/font/scheherazade_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf" -o app/src/main/res/font/readex_pro.ttf
          cp app/src/main/res/font/readex_pro.ttf app/src/main/res/font/readex_pro_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf" -o app/src/main/res/font/noto_sans_arabic.ttf
          cp app/src/main/res/font/noto_sans_arabic.ttf app/src/main/res/font/noto_sans_arabic_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf" -o app/src/main/res/font/noto_naskh_arabic.ttf
          cp app/src/main/res/font/noto_naskh_arabic.ttf app/src/main/res/font/noto_naskh_arabic_bold.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf" -o app/src/main/res/font/ibm_plex_arabic.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf" -o app/src/main/res/font/ibm_plex_arabic_bold.ttf

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.mazwd.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mazwd.app"
                  minSdk 27
                  targetSdk 34
                  versionCode 11
                  versionName "2.7.0"
              }

              signingConfigs {
                  debug {
                      storeFile file("${System.getProperty('user.home')}/.android/mazwd_fixed.keystore")
                      storePassword "mazwd123456"
                      keyAlias "mazwd_key"
                      keyPassword "mazwd123456"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="مفكرة مزود"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
